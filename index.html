function useReveal() {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}

function useCountdown(target) {
  const calc = () => {
    const ms = Math.max(0, target.getTime() - Date.now());
    return { days: Math.floor(ms/86400000), hours: Math.floor((ms%86400000)/3600000), mins: Math.floor((ms%3600000)/60000), secs: Math.floor((ms%60000)/1000) };
  };
  const [t, setT] = React.useState(calc);
  React.useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, []);
  return t;
}

function CountdownLocalized({ t }) {
  const cd = useCountdown(WEDDING_DATA.date);
  const cells = [{v:cd.days,l:t.days},{v:cd.hours,l:t.hours},{v:cd.mins,l:t.mins},{v:cd.secs,l:t.secs}];
  return (
    <div className="countdown-grid" dir="ltr">
      {cells.map((c,i) => (
        <div key={i} className="countdown-cell">
          <div className="countdown-num">{String(c.v).padStart(2,'0')}</div>
          <div className="countdown-label">{c.l}</div>
        </div>
      ))}
    </div>
  );
}

/* ── RSVP ── */
function RSVPLocalized({ t }) {
  const [submitted, setSubmitted] = React.useState(false);
  const [data, setData] = React.useState({name:'',phone:'',attending:'yes',guests:1,pref:'regular',notes:''});
  const upd = k => e => setData(d => ({...d,[k]:e.target.value}));
  if (submitted) {
    return (
      <div style={{textAlign:'center',padding:'40px 20px'}}>
        <div style={{fontFamily:'var(--font-script-display)',fontSize:56,color:'var(--copper)',lineHeight:1}}>{t.thanks}</div>
        <p style={{marginTop:18,color:'var(--ink-soft)',fontSize:15,fontWeight:300}}>{t.thanksSub}</p>
      </div>
    );
  }
  return (
    <form onSubmit={e=>{e.preventDefault();setSubmitted(true);}} style={{maxWidth:480,margin:'0 auto'}}>
      <div className="form-row"><input className="form-input" required value={data.name} onChange={upd('name')} placeholder={t.fName}/></div>
      <div className="form-row"><input className="form-input" type="tel" required value={data.phone} onChange={upd('phone')} placeholder={t.fPhone}/></div>
      <div className="form-row">
        <label className="form-label">{t.fAttend}</label>
        <div className="form-radio-group">
          <label className="form-radio"><input type="radio" name="att" value="yes" checked={data.attending==='yes'} onChange={upd('attending')} required/><span>{t.fYes}</span></label>
          <label className="form-radio"><input type="radio" name="att" value="no" checked={data.attending==='no'} onChange={upd('attending')} required/><span>{t.fNo}</span></label>
        </div>
      </div>
      <div className="form-row" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div><label className="form-label">{t.fGuests}</label><input className="form-input" type="number" min="1" max="10" required value={data.guests} onChange={upd('guests')}/></div>
        <div><label className="form-label">{t.fPref}</label>
          <select className="form-select" value={data.pref} onChange={upd('pref')}>
            <option value="regular">{t.prefRegular}</option>
            <option value="vegan">{t.prefVegan}</option>
            <option value="kosher">{t.prefKosher}</option>
          </select>
        </div>
      </div>
      <div className="form-row"><label className="form-label">{t.fNotes}</label><textarea className="form-textarea" value={data.notes} onChange={upd('notes')} placeholder={t.fNotesPh} style={{borderRadius:15}}/></div>
      <div style={{textAlign:'center',marginTop:28}}><button type="submit" className="btn btn-solid" style={{borderRadius:15}}>{t.fSubmit}</button></div>
    </form>
  );
}

/* =========================================================
   MAIN COMPONENT
   ========================================================= */

      </section>

      {/* ── INVITATION CARD ── */}

          <OrnamentMonogram a="ש" b="ה"/>
