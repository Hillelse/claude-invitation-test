function useCountdown(target) {
  const calc = () => {
    const ms = Math.max(0, target.getTime() - Date.now());
    return { days:Math.floor(ms/86400000), hours:Math.floor((ms%86400000)/3600000), mins:Math.floor((ms%3600000)/60000), secs:Math.floor((ms%60000)/1000) };
  };
  const [t, setT] = React.useState(calc);
  React.useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, []);
  return t;
}

      });
    }, { threshold: 0.15 });
    const dg = document.querySelector('.details-grid');
    if (dg) detIO.observe(dg);

    /* Schedule rows stagger */
    const schedIO = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.querySelectorAll('.sched-wrap').forEach((el, i) => {
            setTimeout(() => {
              el.style.transition = 'opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1)';
              el.style.opacity = '1';
              el.style.transform = 'translateX(0)';
            }, i * 120);
          });
        } else {
          e.target.querySelectorAll('.sched-wrap').forEach(el => {
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.transform = 'translateX(24px)';
          });
        }
      });
    }, { threshold: 0.05 });
    const sl = document.getElementById('sched-list');
    if (sl) schedIO.observe(sl);

    /* Gallery stagger */
    const galIO = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.querySelectorAll('.gallery-wrap').forEach((el, i) => {
            setTimeout(() => {
              el.style.transition = 'opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1)';
              el.style.opacity = '1';
              el.style.transform = 'scale(1)';
            }, i * 90);
          });
        } else {
          e.target.querySelectorAll('.gallery-wrap').forEach(el => {
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.transform = 'scale(0.93)';
          });
        }
      });
    }, { threshold: 0.05 });
    const gg = document.querySelector('.gallery-grid');
    if (gg) galIO.observe(gg);

    /* Countdown cells stagger */
    const cdIO = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.querySelectorAll('.cd-cell').forEach((el, i) => {
            setTimeout(() => {
              el.style.transition = 'opacity 0.75s cubic-bezier(0.16,1,0.3,1), transform 0.75s cubic-bezier(0.16,1,0.3,1)';
              el.style.opacity = '1';
              el.style.transform = 'translateY(0) scale(1)';
            }, i * 90);
          });
        } else {
          e.target.querySelectorAll('.cd-cell').forEach(el => {
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px) scale(0.92)';
          });
        }
      });
    }, { threshold: 0.2 });
    const cdg = document.querySelector('.countdown-grid');
    if (cdg) cdIO.observe(cdg);

    return () => {
      window.removeEventListener('scroll', onScroll);
      revIO.disconnect(); detIO.disconnect(); schedIO.disconnect(); galIO.disconnect(); cdIO.disconnect();
    };
  }, []);
}

function Hero({ t, lang }) {
  const heroRef = React.useRef(null);
  const namesRef = React.useRef(null);

  /* Stagger entrance — native CSS transitions */
  React.useEffect(() => {
    if (!heroRef.current) return;
    const items = Array.from(heroRef.current.querySelectorAll('[data-hero-item]'));
    items.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(40px)'; });
    setTimeout(() => {
      items.forEach((el, i) => {
        setTimeout(() => {
          el.style.transition = 'opacity 1.3s cubic-bezier(0.16,1,0.3,1), transform 1.3s cubic-bezier(0.16,1,0.3,1)';
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
          if (el === namesRef.current) {
            setTimeout(() => { if (namesRef.current) namesRef.current.style.transition = 'none'; }, 1400);
          }
        }, i * 180);
      });
    }, 120);
  }, []);

  /* Parallax names + fade on scroll — native */
  React.useEffect(() => {
    const onScroll = () => {
      if (!namesRef.current) return;
      const progress = Math.min(1, window.scrollY / (window.innerHeight || 1));
      namesRef.current.style.transform = `translateY(${progress * 70}px)`;
      namesRef.current.style.opacity = String(Math.max(0, 1 - progress * 0.7));

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);

  const fontSerif = lang === 'he' ? 'var(--font-serif)' : "'Great Vibes',cursive";
  const nameSize = lang === 'he' ? 'clamp(64px,16vw,160px)' : 'clamp(64px,16vw,140px)';

          {t.nameB}

/* Button with Motion spring hover */
function HoverBtn({ href, children, outline, onClick, type, full }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onEnter = () => animate(el, { scale: 1.04, y: -3 }, { type:'spring', stiffness:300, damping:20 });
    const onLeave = () => animate(el, { scale: 1, y: 0 }, { type:'spring', stiffness:300, damping:22 });
    const onDown  = () => animate(el, { scale: 0.96 }, { duration:0.1 });
    const onUp    = () => animate(el, { scale: 1 }, { type:'spring', stiffness:300, damping:20 });
    el.addEventListener('mouseenter', onEnter);
    el.addEventListener('mouseleave', onLeave);
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
    return () => { el.removeEventListener('mouseenter',onEnter); el.removeEventListener('mouseleave',onLeave); el.removeEventListener('mousedown',onDown); el.removeEventListener('mouseup',onUp); };
  }, []);
  const cls = `btn ${outline ? 'btn-outline' : 'btn-solid'}`;
  const style = { borderRadius:999, ...(full ? {width:'100%',borderRadius:16,padding:'18px 40px',fontSize:17} : {}) };
  if (href) return <a ref={ref} href={href} className={cls} style={style}>{children}</a>;
  return <button ref={ref} type={type||'button'} className={cls} style={style} onClick={onClick}>{children}</button>;
}

  const prev = React.useRef({});
  React.useEffect(() => {
    ['days','hours','mins','secs'].forEach(k => {
      if (prev.current[k] !== cd[k] && refs[k].current) {
        animate(refs[k].current, { y:[-12,0], opacity:[0.3,1] }, { duration:0.32, ease:[0.16,1,0.3,1] });

    prev.current = {...cd};
  }, [cd.secs, cd.mins, cd.hours, cd.days]);

  const cells = [{k:'days',v:cd.days,l:t.days},{k:'hours',v:cd.hours,l:t.hours},{k:'mins',v:cd.mins,l:t.mins},{k:'secs',v:cd.secs,l:t.secs}];

  );

function RSVPLocalized({ t }) {
  const [submitted, setSubmitted] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [data, setData] = React.useState({name:'',phone:'',attending:'yes',guests:1,pref:'regular',notes:''});
  const formRef  = React.useRef(null);
  const thanksRef = React.useRef(null);
  const upd = k => e => setData(d => ({...d,[k]:e.target.value}));

  const handleSubmit = async e => {
    e.preventDefault();
    let rawPhone = data.phone.replace(/[\s\-\.\(\)\/]/g, '');
    if (rawPhone.startsWith('+33')) rawPhone = '0' + rawPhone.slice(3);
    else if (/^0033/.test(rawPhone)) rawPhone = '0' + rawPhone.slice(4);
    else if (rawPhone.startsWith('+972')) rawPhone = '0' + rawPhone.slice(4);
    else if (/^00972/.test(rawPhone)) rawPhone = '0' + rawPhone.slice(5);
    if (!/^\+?[0-9]{7,15}$/.test(rawPhone)) {
      alert(lang === 'he' ? 'מספר טלפון לא תקין' : 'Numéro de téléphone invalide');
      return;
    }
    setLoading(true);
    const newStatus = data.attending === 'yes' ? 'Confirmed' : 'Declined';
    const { data: existing } = await window._sb.from('rsvp').select('*').eq('phone', rawPhone).maybeSingle();
    let error, rsvpId, auditSummary;
    const guestDisplayName = existing ? existing.name.trim() : data.name.trim();
    if (existing) {
      const existingName = existing.name.trim();
      const typedName = data.name.trim();
      const mergedName = typedName && typedName.toLowerCase() !== existingName.toLowerCase()
        ? `${existingName} (${typedName})` : existingName;
      const diff = [];
      if (Number(data.guests) !== existing.guests) diff.push(`אורחים: ${existing.guests}→${data.guests}`);
      if (data.pref !== existing.pref)             diff.push(`תפריט: ${existing.pref}→${data.pref}`);
      if (data.attending !== existing.attending)   diff.push(`הגעה: ${existing.attending}→${data.attending}`);
      auditSummary = diff.length > 0 ? `מילא טופס · ${diff.join(' · ')}` : 'מילא טופס · אישר פרטים';
      rsvpId = existing.id;
      ({ error } = await window._sb.from('rsvp').update({
        name: mergedName, attending: data.attending,
        guests: Number(data.guests), pref: data.pref,
        notes: data.notes || null, status: newStatus,
      }).eq('id', existing.id));
    } else {
      auditSummary = 'מילא טופס לראשונה';
      const { data: inserted, error: insertErr } = await window._sb.from('rsvp').insert([{
        name: data.name, phone: rawPhone, attending: data.attending,
        guests: Number(data.guests), pref: data.pref,
        notes: data.notes || null, status: newStatus,
      }]).select().single();
      error = insertErr;
      rsvpId = inserted?.id;
    }
    if (!error && rsvpId) {
      await window._sb.from('rsvp_audit').insert({ rsvp_id: rsvpId, changed_by: guestDisplayName, summary: auditSummary });
    }
    setLoading(false);
    if (error) { alert(error.message); return; }
    const exit = animate
      ? animate(formRef.current, { opacity:0, y:-20 }, { duration:0.4, ease:[0.4,0,1,1] })
      : Promise.resolve();
    exit.then(() => setSubmitted(true));
  };

  React.useEffect(() => {
    if (submitted && thanksRef.current) {
      if (animate) animate(thanksRef.current, { opacity:[0,1], y:[28,0], scale:[0.95,1] }, { duration:0.85, ease:[0.16,1,0.3,1] });
      else { thanksRef.current.style.opacity = '1'; }
      setTimeout(() => thanksRef.current?.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
    }
  }, [submitted]);

  if (submitted) {
    return (
      <div ref={thanksRef} style={{textAlign:'center',padding:'40px 20px',opacity:0}}>
        <div style={{fontFamily:"'Great Vibes',cursive",fontSize:60,color:'var(--copper)',lineHeight:1.2}}>{t.thanks}</div>
        <p style={{marginTop:20,color:'var(--ink-soft)',fontSize:15,fontWeight:300,lineHeight:1.8}}>{t.thanksSub}</p>
      </div>
    );
  }

  return (
    <form ref={formRef} onSubmit={handleSubmit} style={{maxWidth:480,margin:'0 auto'}}>
      <div className="form-row"><input className="form-input" required value={data.name} onChange={upd('name')} placeholder={t.fName}/></div>
      <div className="form-row"><input className="form-input" type="tel" required value={data.phone} onChange={upd('phone')} placeholder={t.fPhone} style={{direction:'inherit'}}/></div>
      <div className="form-row">
        <label className="form-label">{t.fAttend}</label>
        <div className="form-radio-group">
          <label className="form-radio"><input type="radio" name="att" value="yes" checked={data.attending==='yes'} onChange={upd('attending')} required/><span>{t.fYes}</span></label>
          <label className="form-radio"><input type="radio" name="att" value="no"  checked={data.attending==='no'}  onChange={upd('attending')} required/><span>{t.fNo}</span></label>
        </div>
      </div>
      <div className="form-row two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        <div><label className="form-label">{t.fGuests}</label><input className="form-input" type="number" min="1" max="10" required value={data.guests} onChange={upd('guests')}/></div>
        <div><label className="form-label">{t.fPref}</label>
          <select className="form-select" value={data.pref} onChange={upd('pref')}>
            <option value="regular">{t.prefRegular}</option>
            <option value="vegan">{t.prefVegan}</option>
            <option value="kosher">{t.prefKosher}</option>
          </select>
        </div>
      </div>
      <div className="form-row"><label className="form-label">{t.fNotes}</label><textarea className="form-textarea" value={data.notes} onChange={upd('notes')} placeholder={t.fNotesPh}/></div>
      <div style={{textAlign:'center',marginTop:32}}>
        <HoverBtn type="submit" full disabled={loading} style={loading?{opacity:0.6,pointerEvents:'none'}:{}}>{loading ? '...' : t.fSubmit}</HoverBtn>
      </div>
    </form>
  );
}

      <section style={{padding:'clamp(30px,5vw,60px) clamp(20px,5vw,32px)',background:'var(--cream-deep)'}}>
        <div className="invite-card" style={{padding:0,overflow:'hidden'}}>
          <img src={lang==='he' ? "./uploads/shirel-hillel-invitation-he.png" : "./uploads/shirel-hillel-invitation-fr.png"} alt="Shirel & Hillel Wedding Invitation" style={{width:'100%',display:'block'}}/>
        </div>
      </section>

      {/* ── DETAILS ── */}
      <section style={{padding:'clamp(60px,10vw,120px) clamp(20px,5vw,32px)'}}>
        <div className="reveal" style={{textAlign:'center',marginBottom:70}}>
          <h2 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(30px,4vw,44px)',fontWeight:400,color:'var(--ink)'}}>{t.detailsKicker}</h2>
          <div style={{marginTop:20,maxWidth:140,margin:'20px auto 0'}}><OrnamentSimple/></div>
        </div>
        <div className="details-grid" style={{maxWidth:900,margin:'0 auto',display:'grid',gridTemplateColumns:'repeat(3,1fr)'}}>
          {[
            {label:t.dateLabel, main:t.dateMain, sub:t.dateSub,  ltr:true},
            {label:t.placeLabel,main:t.placeMain,sub:t.placeSub},
            {label:t.timeLabel, main:t.timeMain,  sub:t.timeSub,  ltr:true},
          ].map((d,i) => (
            <div key={i} className="detail-cell" style={{opacity:0,transform:'translateY(24px)'}}>
              <div style={{fontSize:11,letterSpacing:'0.44em',color:'var(--copper)',textTransform:'uppercase',fontWeight:500,fontFamily:'var(--font-serif)'}}>{d.label}</div>
              <div style={{fontFamily:'var(--font-serif)',fontSize:'clamp(28px,4vw,36px)',fontWeight:400,margin:'22px 0 12px',color:'var(--ink)'}} dir={d.ltr?'ltr':''}>{d.main}</div>
              <div style={{fontSize:15,color:'var(--ink-soft)',fontWeight:300,letterSpacing:'0.04em'}}>{d.sub}</div>
            </div>
          ))}
        </div>
      </section>

      {/* ── COUNTDOWN ── */}
      <section style={{position:'relative',padding:'clamp(60px,10vw,100px) clamp(20px,5vw,32px) clamp(60px,10vw,120px)',background:'var(--cream-deep)',textAlign:'center',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,backgroundImage:"url('./uploads/site-background.png')",backgroundSize:'cover',backgroundPosition:'center',backgroundRepeat:'no-repeat',opacity:0.9,pointerEvents:'none'}}/>
        <div className="reveal" style={{position:'relative',zIndex:1}}>
          <h3 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(24px,3vw,34px)',fontWeight:400,marginBottom:16,color:'var(--ink)',letterSpacing:'0.04em'}}>{t.countdownKicker}</h3>
          <div style={{marginBottom:44,maxWidth:100,margin:'14px auto 44px'}}><OrnamentSimple/></div>
        </div>
        <div style={{position:'relative',zIndex:1}}><CountdownLocalized t={t}/></div>
      </section>

      {/* ── SCHEDULE ── */}
      <section style={{padding:'clamp(60px,10vw,120px) clamp(20px,5vw,32px)'}}>
        <div className="reveal" style={{textAlign:'center',marginBottom:60}}>
          <h2 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(30px,4vw,44px)',fontWeight:400,color:'var(--ink)'}}>{t.scheduleKicker}</h2>
          <div style={{marginTop:20,maxWidth:140,margin:'20px auto 0'}}><OrnamentSimple/></div>
        </div>
        <div id="sched-list" style={{maxWidth:620,margin:'0 auto'}}>
          {t.sched.map((r,i) => (
            <div key={i} className="sched-wrap" style={{borderBottom:i<t.sched.length-1?'1px solid var(--line)':'none',opacity:0,transform:'translateX(24px)'}}>
              <div style={{display:'grid',gridTemplateColumns:'90px 1fr',gap:24,alignItems:'flex-start'}}>
                <div style={{textAlign:'left',direction:'ltr',fontFamily:'var(--font-serif)',fontSize:32,fontWeight:400,color:'var(--copper-deep)',letterSpacing:'0.04em',paddingTop:2}}>{r[0]}</div>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:14}}>{icons[i]}<div style={{fontFamily:'var(--font-serif)',fontSize:22,fontWeight:500,color:'var(--ink)'}}>{r[1]}</div></div>
                  <div style={{marginTop:8,color:'var(--ink-soft)',fontWeight:300,fontSize:15,lineHeight:1.7,paddingInlineStart:36}}>{r[2]}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* ── MAP ── */}
      <section style={{position:'relative',padding:'clamp(40px,6vw,60px) clamp(20px,5vw,32px) clamp(60px,10vw,120px)',background:'var(--cream-deep)',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,backgroundImage:"url('./uploads/site-background3.png')",backgroundSize:'cover',backgroundPosition:'center',backgroundRepeat:'no-repeat',opacity:0.1,pointerEvents:'none'}}/>
        <div className="reveal" style={{position:'relative',zIndex:1,textAlign:'center',marginBottom:48}}>
          <h3 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(28px,3.4vw,38px)',fontWeight:400,color:'var(--ink)'}}>{t.mapKicker}</h3>
        </div>
        <div className="reveal map-card" style={{position:'relative',zIndex:1,maxWidth:480,margin:'0 auto'}}>
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="var(--copper)" strokeWidth="1.1" style={{margin:'0 auto 18px',display:'block'}}>
            <path d="M24 6 C 16 6, 10 12, 10 20 C 10 30, 24 42, 24 42 C 24 42, 38 30, 38 20 C 38 12, 32 6, 24 6 Z"/>
            <circle cx="24" cy="20" r="4"/>
          </svg>
          <div style={{fontFamily:'var(--font-serif)',fontSize:28,fontWeight:500,color:'var(--ink)'}}>{t.venueName}</div>
          <div style={{marginTop:14,fontSize:16,color:'var(--ink-soft)',fontWeight:300,lineHeight:1.8,whiteSpace:'pre-line'}}>{t.venueLine}</div>
          <NavButtons t={t}/>
        </div>
      </section>

      {/* ── GALLERY ── */}
      <section style={{padding:'clamp(60px,10vw,120px) clamp(20px,5vw,32px)'}}>
        <div className="reveal" style={{textAlign:'center',marginBottom:60}}>
          <h2 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(28px,3.4vw,38px)',fontWeight:400,color:'var(--ink)'}}>{t.galleryKicker}</h2>
        </div>
        <div className="gallery-grid" style={{maxWidth:980,margin:'0 auto',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gridTemplateRows:'auto auto',gap:12}}>
          {[
            {row:'span 2',src:'./photos/site-1.jpg',ratio:'3/4'},
            {src:'./photos/site-2.jpg',ratio:'4/3'},
            {src:'./photos/site-3.jpg',ratio:'4/3',pos:'center 15%'},
            {src:'./photos/site-4.jpg',ratio:'4/3'},
            {src:'./photos/site-5.PNG',ratio:'4/3'},
          ].map((p,i) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
              const el = ref.current;
              if (!el) return;
              const on = () => animate(el, {scale:1.03},{duration:0.5,ease:[0.22,0.61,0.36,1]});
              const off= () => animate(el, {scale:1},{duration:0.4,ease:[0.22,0.61,0.36,1]});
              el.addEventListener('mouseenter',on); el.addEventListener('mouseleave',off);
              return () => { el.removeEventListener('mouseenter',on); el.removeEventListener('mouseleave',off); };
            }, []);
            return (
              <div key={i} className="gallery-wrap" style={{gridRow:p.row||'auto',opacity:0,transform:'scale(0.93)'}}>
                <div ref={ref} style={{width:'100%',height:'100%'}}>
                  <img src={p.src} style={{width:'100%',aspectRatio:p.ratio,objectFit:'cover',objectPosition:p.pos||'center',display:'block'}} loading="lazy"/>
                </div>
                <div className="gallery-overlay"/>
              </div>
            );
          })}
        </div>
      </section>

      {/* ── RSVP ── */}
      <section id="rsvp" style={{padding:'clamp(60px,10vw,120px) clamp(20px,5vw,32px)',background:'var(--cream-deep)'}}>
        <div className="reveal" style={{textAlign:'center',marginBottom:56}}>
          <h2 style={{fontFamily:'var(--font-serif)',fontSize:'clamp(30px,4vw,44px)',fontWeight:400,color:'var(--ink)'}}>{t.rsvpKicker}</h2>
          <p style={{marginTop:16,color:'var(--ink-soft)',fontWeight:300,fontSize:16,letterSpacing:'0.04em'}}>{t.rsvpDeadline}</p>
          <div style={{marginTop:28,maxWidth:160,margin:'28px auto 0'}}><OrnamentSimple/></div>
        </div>
        <div className="reveal rsvp-glass">
          <RSVPLocalized t={t}/>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{padding:'clamp(40px,6vw,70px) 20px clamp(50px,8vw,90px)',textAlign:'center',background:'var(--cream-deep)'}}>
        <div className="reveal" style={{fontFamily:"'Great Vibes',cursive",fontSize:64,color:'var(--copper)',lineHeight:1}}>Shirel &amp; Hillel</div>
        <div className="reveal" dir="ltr" style={{marginTop:14,fontFamily:'var(--font-serif)',fontSize:19,fontWeight:300,letterSpacing:'0.24em',color:'var(--copper-deep)'}}>
          09 · 08 · 2026
        </div>
        <div className="reveal" style={{marginTop:32,maxWidth:280,margin:'32px auto 0'}}><OrnamentSimple/></div>
        <div className="reveal" style={{marginTop:24,fontFamily:fontSerif,fontStyle:fontItalic,fontSize:14,color:'var(--ink-soft)',letterSpacing:'0.08em'}}>{t.footerSign}</div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
